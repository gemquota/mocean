name: Deploy Mocean to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js for model asset intake
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checkout pinned Quaternius animated fish models
        uses: actions/checkout@v4
        with:
          repository: Vitexus/ishtaria-client
          ref: f42095c120c29a892c0c221bdc8357ac982ccfca
          path: _upstream/fish-assets
          sparse-checkout: |
            assets/quaternius/animated-fish-bundle/Models
            assets/quaternius/animated-fish-bundle/License.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
        continue-on-error: true
      - name: Checkout pinned PolyFish rigged model
        uses: actions/checkout@v4
        with:
          repository: unclemattmakes/polyfish
          ref: 1c0d7636f2c71fd81d001a597c13554f9cbdd417
          path: _upstream/polyfish
          sparse-checkout: |
            assets/models/fish_rigged.glb
            LICENSE
          sparse-checkout-cone-mode: false
          persist-credentials: false
        continue-on-error: true
      - name: Assemble reviewed marine creature assets
        timeout-minutes: 10
        continue-on-error: true
        run: |
          node scripts/copy-osmocean-animated-models.mjs || echo "::warning::Animated fish asset intake failed; continuing without that catalogue."
          node scripts/copy-osmocean-polyfish-model.mjs || echo "::warning::PolyFish asset intake failed; continuing without that model."
          node scripts/download-osmocean-static-models.mjs || echo "::warning::Static marine asset intake failed; continuing without that catalogue."
      - name: Remove temporary upstream sources
        if: always()
        run: rm -rf _upstream
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
