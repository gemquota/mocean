name: Deploy Mocean to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout pinned Quaternius animated fish assets
        uses: actions/checkout@v7
        with:
          repository: Vitexus/ishtaria-client
          ref: f42095c120c29a892c0c221bdc8357ac982ccfca
          path: _upstream/fish-assets
          sparse-checkout: |
            assets/quaternius/animated-fish-bundle/Models
            assets/quaternius/animated-fish-bundle/License.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout pinned PolyFish animated dolphin model
        uses: actions/checkout@v7
        with:
          repository: unclemattmakes/polyfish
          ref: 1c0d7636f2c71fd81d001a597c13554f9cbdd417
          path: _upstream/polyfish
          sparse-checkout: |
            assets/models/dolphin_rigged.glb
            LICENSE
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Stage animated marine models and original licences
        run: |
          mkdir -p assets/models/osmocean/species
          cp _upstream/fish-assets/assets/quaternius/animated-fish-bundle/Models/*.glb assets/models/osmocean/species/
          cp _upstream/fish-assets/assets/quaternius/animated-fish-bundle/License.txt assets/models/osmocean/species/QUATERNIUS-CC0-LICENSE.txt
          cp _upstream/polyfish/assets/models/dolphin_rigged.glb assets/models/osmocean/species/
          cp _upstream/polyfish/LICENSE assets/models/osmocean/species/POLYFISH-MIT-LICENSE.txt
          node scripts/verify-animated-marine-models.mjs assets/models/osmocean/species
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
