<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06151d">
<title>Mocean · Naturalistic Marine Model Review</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06151d;color:#d7eee7;font:11px ui-monospace,SFMono-Regular,Consolas,monospace}canvas{display:block;width:100%;height:100%}.panel{position:fixed;z-index:2;top:16px;left:16px;width:min(360px,calc(100vw - 32px));padding:14px;border:1px solid #8acbb53d;border-radius:6px;background:#061a22e8;backdrop-filter:blur(10px)}h1{margin:0 0 12px;color:#a6e5ce;font-size:12px;letter-spacing:.15em;font-weight:600}.field{display:grid;gap:6px;margin:10px 0}.field label,.meta{color:#9bbab5a8;font-size:9px;letter-spacing:.1em}.field select{width:100%;padding:9px;background:#0b2831;border:1px solid #31565b;border-radius:4px;color:#d7eee7;font:10px ui-monospace}.actions{display:flex;gap:7px}.actions button{flex:1;padding:8px;background:#12353b;border:1px solid #46736e;border-radius:4px;color:#b9ead5;font:9px ui-monospace;letter-spacing:.08em}.meta{white-space:pre-line;line-height:1.8;margin-top:12px;overflow-wrap:anywhere}.footer{position:fixed;bottom:14px;left:16px;right:16px;text-align:right;color:#9bbab57a;font-size:9px;letter-spacing:.08em;pointer-events:none}@media(max-width:600px){.panel{top:10px;left:10px;width:min(330px,calc(100vw - 20px));padding:11px}.footer{bottom:9px;font-size:8px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="view"></canvas>
<section class="panel">
<h1>NATURALISTIC MARINE MODEL REVIEW</h1>
<div class="field"><label for="model">SPECIES / MODEL</label><select id="model"><option>Loading naturalistic model catalogue…</option></select></div>
<div class="actions"><button id="play">PAUSE SWIM</button><button id="reset">RESET VIEW</button></div>
<div class="meta" id="meta">Loading twelve CC0 marine GLBs…</div>
</section>
<div class="footer">DRAG TO ORBIT · SCROLL TO ZOOM · PROCEDURAL SWIM · CC0 SOURCE MODELS</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OsmoceanMarineModels } from './src/phase6/osmocean-marine-models.js';

const canvas=document.querySelector('#view');
const select=document.querySelector('#model');
const meta=document.querySelector('#meta');
const playButton=document.querySelector('#play');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x061a24);
scene.fog=new THREE.FogExp2(0x061a24,.018);
const camera=new THREE.PerspectiveCamera(42,1,.1,100);
camera.position.set(0,1.2,10);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1;
scene.add(new THREE.HemisphereLight(0xb8e8f0,0x142b2d,1.65));
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(-4,8,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x4d9eac,.8);fill.position.set(5,2,-6);scene.add(fill);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);
const floor=new THREE.GridHelper(12,24,0x24515a,0x17353e);floor.position.y=-2.7;scene.add(floor);
const models=new OsmoceanMarineModels(THREE,{baseUrl:'./assets/models/osmocean/naturalistic/'});
const names={barracuda:'Barracuda',marlin:'Blue marlin',tuna:'Bluefin tuna',shark:'Great white shark',whaleShark:'Whale shark',mola:'Ocean sunfish',manta:'Manta ray',stingray:'Southern stingray',orca:'Orca',spermWhale:'Sperm whale',dolphin:'Bottlenose dolphin',jellyfish:'Moon jellyfish'};
let entries=[],currentInstance=null,currentRoot=null,playing=true,selectionVersion=0;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

async function loadEntry(entry){
 const version=++selectionVersion;
 meta.textContent='Loading '+(names[entry.species]??entry.species)+'…';
 if(currentRoot){scene.remove(currentRoot);currentRoot=null;}
 currentInstance?.dispose();
 const instance=await models.createInstance(entry.species,{targetLength:5});
 if(version!==selectionVersion){instance.dispose();return;}
 const root=new THREE.Group();root.add(instance.visual);scene.add(root);
 currentRoot=root;currentInstance=instance;
 meta.textContent=[
  names[entry.species]??entry.species,
  'SOURCE: 3DASSETS.DEV · ASSET '+entry.assetId,
  'GEOMETRY: '+entry.meshes+' MESHES · '+entry.primitives+' PRIMITIVES',
  'MOTION: '+instance.animationMode,
  'LICENCE: CC0 1.0 UNIVERSAL',
  'STATIC SOURCE MESH · PROCEDURAL VERTEX SWIMMING'
 ].join('\n');
 controls.target.set(0,0,0);camera.position.set(0,1.2,10);controls.update();
}
async function initialise(){
 const response=await fetch('./assets/models/osmocean/naturalistic/catalog.json');
 if(!response.ok)throw new Error('Model catalogue · HTTP '+response.status);
 const catalogue=await response.json();
 entries=catalogue.models??[];
 if(!entries.length)throw new Error('No naturalistic marine models were staged');
 select.replaceChildren();
 entries.forEach((entry,index)=>{
  const option=document.createElement('option');
  option.value=String(index);
  option.textContent=names[entry.species]??entry.species;
  select.append(option);
 });
 await loadEntry(entries[0]);
}
select.addEventListener('change',()=>loadEntry(entries[Number(select.value)]).catch(error=>{meta.textContent='Model load failed: '+error.message;}));
playButton.addEventListener('click',()=>{playing=!playing;playButton.textContent=playing?'PAUSE SWIM':'PLAY SWIM';});
document.querySelector('#reset').addEventListener('click',()=>{controls.reset();camera.position.set(0,1.2,10);controls.target.set(0,0,0);controls.update();});
initialise().catch(error=>{meta.textContent='Naturalistic model catalogue failed: '+error.message;});
const clock=new THREE.Clock();
function frame(){
 requestAnimationFrame(frame);
 const dt=Math.min(clock.getDelta(),.05);
 if(playing&&currentInstance)currentInstance.update(dt);
 controls.update();renderer.render(scene,camera);
}
frame();
</script>
</body>
</html>
