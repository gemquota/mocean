<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#06151d">
<title>Mocean · Endless voxel terrain study</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#06151d;color:#d7eee7;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}
#status{position:fixed;top:16px;left:18px;z-index:2;padding:11px 14px;border:1px solid #8acbb53d;border-radius:5px;background:#061a22dc;line-height:1.8;letter-spacing:.07em;pointer-events:none;backdrop-filter:blur(8px)}
#status strong{color:#a6e5ce;font-weight:600}#status small{display:block;color:#9bbab5a8;font-size:9px}
#habitat{position:fixed;top:16px;right:18px;z-index:3;padding:10px 13px;border:1px solid #8acbb566;border-radius:5px;background:#061a22dc;color:#b9e8d8;text-decoration:none;letter-spacing:.06em;backdrop-filter:blur(8px)}
#habitat:hover{background:#12323b}
#hint{position:fixed;right:18px;bottom:16px;color:#b2d1c9a8;font-size:9px;letter-spacing:.08em;pointer-events:none;text-align:right;line-height:1.8}
@media(max-width:600px){#status{top:10px;left:10px;font-size:9px;padding:8px 10px}#habitat{top:10px;right:10px;font-size:9px;padding:8px 10px}#hint{right:10px;bottom:10px;font-size:8px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="status"><strong>MOCEAN / TERRAIN STREAMING STUDY</strong><small id="state">Starting terrain workers…</small></div>
<a id="habitat" href="./schooling.html">OPEN LIVE HABITAT ↗</a>
<div id="hint">1 FINGER / LEFT DRAG · PAN<br>2 FINGERS / RIGHT DRAG · ROTATE · PINCH TO ZOOM<br>WHEEL TO ZOOM · 32-UNIT STREAMED CHUNKS</div>
<canvas id="world" aria-label="A procedurally generated underwater seabed viewed from above"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createTerrainChunkStream } from './src/phase6/streamed-voxel-terrain.js';

const canvas=document.querySelector('#world');
const state=document.querySelector('#state');
let stream=null,controls=null,renderer=null;
try{
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.02;

 const scene=new THREE.Scene();
 scene.background=new THREE.Color(0x071c27);
 // Fog hides the streamed horizon rather than exposing the edge of a finite floor.
 scene.fog=new THREE.FogExp2(0x092b37,.026);
 const camera=new THREE.PerspectiveCamera(48,1,.1,220);
 camera.position.set(0,15,43);
 controls=new OrbitControls(camera,renderer.domElement);
 controls.target.set(0,-8.3,0);
 controls.enableDamping=true;
 controls.dampingFactor=.075;
 controls.enablePan=true;
 controls.screenSpacePanning=false;
 // OrbitControls defaults to one-finger orbit. Reverse that for a useful touch map:
 // one finger pans, two fingers rotate, and the two-finger pinch still dollies.
 controls.touches.ONE=THREE.TOUCH.PAN;
 controls.touches.TWO=THREE.TOUCH.DOLLY_ROTATE;
 controls.minDistance=17;
 controls.maxDistance=76;
 controls.minPolarAngle=.12;
 controls.maxPolarAngle=1.36;
 controls.minAzimuthAngle=-Infinity;
 controls.maxAzimuthAngle=Infinity;

 scene.add(new THREE.HemisphereLight(0xa8dce0,0x172d2d,1.25));
 const key=new THREE.DirectionalLight(0xd9eee0,2.0);
 key.position.set(-22,28,18);
 scene.add(key);
 const fill=new THREE.DirectionalLight(0x318ba0,.62);
 fill.position.set(18,5,-24);
 scene.add(fill);

 function resize(){
  const width=innerWidth,height=innerHeight;
  renderer.setSize(width,height,false);
  camera.aspect=width/Math.max(1,height);
  camera.updateProjectionMatrix();
 }
 addEventListener('resize',resize);
 resize();

 stream=createTerrainChunkStream({
  THREE,scene,workerCount:2,chunkSize:32,radius:3,prefetchRadius:4,maxChunks:81,seed:6102026,
  onUpdate:stats=>{
   state.textContent=stats.loaded+' chunks ready · '+stats.pending+' queued / generating · '+stats.visible+' in view';
  }
 });

 const forward=new THREE.Vector3();
 let lastStreamUpdate=0;
 function updateStream(now){
  if(now-lastStreamUpdate<140)return;
  lastStreamUpdate=now;
  camera.getWorldDirection(forward);
  stream.update({
   x:controls.target.x,z:controls.target.z,
   forwardX:forward.x,forwardZ:forward.z
  });
 }

 function keepCameraAboveSeabed(){
  // The generated seabed tops out close to y=-7. Keep the camera rig above it
  // even when a pan gesture tries to drag the target below the terrain.
  const minimumCameraY=-3.5;
  if(camera.position.y<minimumCameraY){
   const lift=minimumCameraY-camera.position.y;
   camera.position.y+=lift;
   controls.target.y+=lift;
  }
 }

 updateStream(0);
 function animate(now){
  requestAnimationFrame(animate);
  controls.update();
  keepCameraAboveSeabed();
  updateStream(now);
  renderer.render(scene,camera);
 }
 requestAnimationFrame(animate);
 addEventListener('pagehide',()=>{stream?.dispose();renderer?.dispose();},{once:true});
}catch(error){
 state.textContent='WEBGL / WORKER INITIALISATION FAILED · '+String(error?.message??error);
 console.error(error);
}
</script>
</body>
</html>
