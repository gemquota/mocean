<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06151d">
<title>Mocean · Endless voxel terrain</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#06151d;color:#d7eee7;font:11px ui-monospace,SFMono-Regular,Consolas,monospace}canvas{display:block;width:100%;height:100%}
#status{position:fixed;top:16px;left:18px;z-index:2;padding:11px 14px;border:1px solid #8acbb53d;border-radius:5px;background:#061a22dc;line-height:1.8;letter-spacing:.07em;pointer-events:none;backdrop-filter:blur(8px)}
#status strong{color:#a6e5ce;font-weight:600}#status small{display:block;color:#9bbab5a8;font-size:9px}
#hint{position:fixed;right:18px;bottom:16px;color:#9bbab57a;font-size:9px;letter-spacing:.08em;pointer-events:none;text-align:right}
@media(max-width:600px){#status{top:10px;left:10px;font-size:9px}#hint{right:10px;bottom:10px;font-size:8px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="status"><strong>MOCEAN / STREAMED VOXEL TERRAIN</strong><small id="state">Starting terrain workers…</small></div>
<div id="hint">DRAG TO ORBIT · RIGHT-DRAG TO PAN · PINCH / WHEEL TO ZOOM<br>32-UNIT CHUNKS · PREDICTIVE WORKER STREAMING · BOUNDED CACHE</div>
<canvas id="world" aria-label="An effectively endless procedurally generated underwater seabed"></canvas>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createTerrainChunkStream } from './src/phase6/streamed-voxel-terrain.js';

const canvas=document.querySelector('#world');
const state=document.querySelector('#state');
let stream=null,controls=null,renderer=null;
try{
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.02;

 const scene=new THREE.Scene();
 scene.background=new THREE.Color(0x071c27);
 scene.fog=new THREE.FogExp2(0x092b37,.018);
 const camera=new THREE.PerspectiveCamera(48,1,.1,260);
 camera.position.set(0,17,58);
 controls=new OrbitControls(camera,renderer.domElement);
 controls.target.set(0,-8.3,0);
 controls.enableDamping=true;
 controls.dampingFactor=.06;
 controls.enablePan=true;
 controls.screenSpacePanning=false;
 controls.minDistance=12;
 controls.maxDistance=190;
 controls.maxPolarAngle=Math.PI*.88;

 scene.add(new THREE.HemisphereLight(0xa8dce0,0x172d2d,1.25));
 const key=new THREE.DirectionalLight(0xd9eee0,2.0);
 key.position.set(-22,28,18);
 scene.add(key);
 const fill=new THREE.DirectionalLight(0x318ba0,.62);
 fill.position.set(18,5,-24);
 scene.add(fill);

 function resize(){
  const width=innerWidth,height=innerHeight;
  renderer.setSize(width,height,false);
  camera.aspect=width/Math.max(1,height);
  camera.updateProjectionMatrix();
 }
 addEventListener('resize',resize);
 resize();

 stream=createTerrainChunkStream({
  THREE,scene,workerCount:2,chunkSize:32,radius:2,prefetchRadius:3,maxChunks:49,seed:6102026,
  onUpdate:stats=>{
   state.textContent=stats.loaded+' chunks ready · '+stats.pending+' queued / generating · '+stats.visible+' in view';
  }
 });

 const forward=new THREE.Vector3();
 let lastStreamUpdate=0;
 function updateStream(now){
  if(now-lastStreamUpdate<180)return;
  lastStreamUpdate=now;
  camera.getWorldDirection(forward);
  stream.update({
   x:controls.target.x,z:controls.target.z,
   forwardX:forward.x,forwardZ:forward.z
  });
 }
 updateStream(0);

 function animate(now){
  requestAnimationFrame(animate);
  controls.update();
  updateStream(now);
  renderer.render(scene,camera);
 }
 requestAnimationFrame(animate);
 addEventListener('pagehide',()=>{stream?.dispose();renderer?.dispose();},{once:true});
}catch(error){
 state.textContent='WEBGL / WORKER INITIALISATION FAILED · '+String(error?.message??error);
 console.error(error);
}
</script>
</body>
</html>
