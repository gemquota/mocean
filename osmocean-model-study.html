<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mocean · Osmocean marine model study</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061923;color:#d8eee8;font:11px ui-monospace,monospace}canvas{display:block}#hud{position:fixed;top:12px;left:14px;padding:10px 12px;background:#061923dc;border:1px solid #8acbb555;line-height:1.7;pointer-events:none}#hud small{display:block;color:#a7c9c0}#error{color:#ffb8a5}</style></head><body><div id="hud"><b>MOCEAN / OSMOCEAN ANIMATED MODELS</b><small id="status">Loading pinned Quaternius CC0 GLBs…</small><small id="error"></small><small>Rigged animation clips play independently · fixed simulation not connected in this viewer</small></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {clone as cloneSkeleton} from 'three/addons/utils/SkeletonUtils.js';
const ids=['anglerfish','black_lion_fish','coral_grouper','goblin_shark','humphead','lionfish','parrot_fish','puffer','shark','sunfish','swordfish','tuna','clownfish','blue_tang','butterfly_fish','moorish_idol'];
const scene=new THREE.Scene();scene.background=new THREE.Color('#082a36');scene.fog=new THREE.FogExp2('#123b43',.012);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,250);camera.position.set(0,16,34);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight('#c1e9e6','#172b2a',1.5));const key=new THREE.DirectionalLight('#d2edff',2.8);key.position.set(-12,24,16);key.castShadow=true;scene.add(key);const fill=new THREE.DirectionalLight('#4a9eaa',.8);fill.position.set(12,4,-14);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,50),new THREE.MeshStandardMaterial({color:'#244b49',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-6;floor.receiveShadow=true;scene.add(floor);
const loader=new GLTFLoader(),mixers=[],errors=[];let loaded=0;
for(let i=0;i<ids.length;i++){const id=ids[i];try{const gltf=await loader.loadAsync('./assets/models/osmocean/species/'+id+'.glb');const visual=cloneSkeleton(gltf.scene);visual.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(visual),size=bounds.getSize(new THREE.Vector3());const longest=Math.max(size.x,size.y,size.z);visual.scale.setScalar(3.6/Math.max(longest,.001));visual.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(visual);visual.position.sub(box.getCenter(new THREE.Vector3()));const root=new THREE.Group();root.position.set((i%5-2)*12,0,(Math.floor(i/5)-1)*13);root.add(visual);scene.add(root);if(gltf.animations?.length){const mixer=new THREE.AnimationMixer(visual);const clip=gltf.animations.find(c=>/swim|idle|move/i.test(c.name))??gltf.animations[0];mixer.clipAction(clip).play();mixers.push(mixer);}const label=document.createElement('div');label.textContent=id+' · '+(gltf.animations?.map(c=>c.name).join(', ')||'no embedded clips');label.style.cssText='position:fixed;left:0;top:0;color:#d8eee8;background:#061923aa;padding:3px 5px;font:10px monospace;pointer-events:none';document.body.append(label);root.userData.label=label;root.userData.id=id;loaded++;}catch(e){errors.push(id+': '+e.message);}}
document.querySelector('#status').textContent=loaded+'/'+ids.length+' models loaded · '+mixers.length+' with embedded animation clips';
document.querySelector('#error').textContent=errors.join(' | ');
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);for(const mixer of mixers)mixer.update(dt);controls.update();renderer.render(scene,camera);const v=new THREE.Vector3();for(const child of scene.children)if(child.userData.label){child.getWorldPosition(v);v.project(camera);const x=(v.x*.5+.5)*innerWidth,y=(-v.y*.5+.5)*innerHeight;child.userData.label.style.transform='translate('+x+'px,'+y+'px)';}}const clock=new THREE.Clock();animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
