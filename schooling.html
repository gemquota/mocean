<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06141b">
<title>Mocean · Mixed-species habitat</title>
<style>
:root{color-scheme:dark;--mint:#9be7c8;--muted:rgba(190,220,215,.58)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#06141b;overscroll-behavior:none;touch-action:none}
body{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#d9eee5}

header,footer{position:fixed;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;gap:14px;pointer-events:none}
.population-control{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);width:min(360px,calc(100vw - 40px));padding:10px 13px 9px;border:1px solid rgba(155,231,200,.18);border-radius:8px;background:rgba(4,18,26,.78);backdrop-filter:blur(8px);pointer-events:auto;touch-action:pan-x}
.population-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px;font-size:9px;letter-spacing:.12em;color:var(--muted)}
.population-heading output{color:var(--mint);font-size:11px;font-variant-numeric:tabular-nums}

.population-scale{display:flex;justify-content:space-between;margin-top:2px;font-size:8px;letter-spacing:.08em;color:rgba(190,220,215,.4)}
header{top:20px}footer{bottom:18px;font-size:9px;letter-spacing:.12em;color:var(--muted)}

.status{font-size:9px;letter-spacing:.13em;color:rgba(155,231,200,.8);text-align:right}.species-counts{position:fixed;top:51px;right:24px;z-index:2;font-size:9px;line-height:1.8;letter-spacing:.1em;text-align:right;color:rgba(190,220,215,.72);pointer-events:none;text-shadow:0 1px 5px #04121a}.species-counts b{color:#b8e8d1;font-weight:600}
a{pointer-events:auto;color:var(--mint);text-decoration:none}
a:hover{text-decoration:underline}
@media(max-width:600px){header,footer{left:14px;right:14px}header{top:14px}.species-counts{top:42px;right:14px;font-size:8px;line-height:1.65}.brand{font-size:8px;gap:7px}.mark{width:21px;height:21px}.status{font-size:8px}footer{font-size:8px;bottom:13px}.population-control{bottom:43px;width:min(320px,calc(100vw - 32px));padding:8px 11px}.population-heading{font-size:8px}}
</style>
</head>
<body>
<canvas id="school" aria-label="A mixed habitat of schooling fish, moray eels, crabs, lobsters, mantis shrimp, manta rays, stingrays, reef sharks, whale sharks, starfish, dolphins, dedicated shoaling fish and drifting plankton"></canvas>
<header><div class="brand"><span class="mark">M</span><span>MOCEAN / MIXED-SPECIES HABITAT</span></div><div class="status" id="status">150 CREATURES · 12 SPECIES</div></header><div class="species-counts" id="species-counts">REGULAR FISH 31<br>SCHOOLING FISH 63<br>EELS 22<br>CRABS 5<br>LOBSTERS 5<br>MANTIS SHRIMP 3<br>MANTA RAYS 3<br>STINGRAYS 3<br>SHARKS 3<br>WHALE SHARKS 3<br>STARFISH 4<br>DOLPHINS 5</div>
<section class="population-control" aria-label="Visible creature population control"><div class="population-heading"><label for="population">VISIBLE POPULATION</label><output id="population-value" for="population">150</output></div><input id="population" type="range" min="50" max="200" step="10" value="150" aria-label="Number of visible creatures"><div class="population-scale"><span>50 CREATURES</span><span>200 CREATURES</span></div></section>
<footer><span id="metrics">SEPARATION · ALIGNMENT · COHESION</span><a href="./">RETURN TO SINGLE FISH ↗</a></footer>
<script type="module">
import { createSchool, stepSchool, SCHOOLING_FISH_SCALE } from './src/schooling.js';
import { createGait, stepGait, deformPoint, articulateFinPoint } from './src/core/body.js';
import { quatFromEuler, quatRotate, vec3, add3, cross3, dot3, normalize3, scale3, angleDelta, TAU } from './src/core/math.js';

const canvas=document.getElementById('school'),ctx=canvas.getContext('2d',{alpha:false});
const status=document.getElementById('status'),metrics=document.getElementById('metrics'),speciesCounts=document.getElementById('species-counts');
const populationSlider=document.getElementById('population'),populationValue=document.getElementById('population-value');
let school=createSchool(150);
function initialiseFishVisualState(nextSchool){
 for(const fish of nextSchool.fish){fish.gait=createGait();fish.heading=0;fish.pitch=0;}
}
function setPopulation(value){
 const count=Math.max(50,Math.min(200,Math.round(Number(value)/10)*10));
 if(count===school.fish.length)return;
 const nextSchool=createSchool(count);
 initialiseFishVisualState(nextSchool);
 school=nextSchool;
 populationSlider.value=String(count);populationValue.textContent=count.toLocaleString('en-US');
 status.textContent=count.toLocaleString('en-US')+' CREATURES · 12 SPECIES';
}
populationSlider.addEventListener('input',event=>{
 const count=Math.max(50,Math.min(200,Math.round(Number(event.target.value)/10)*10));
 populationValue.textContent=count.toLocaleString('en-US');
 status.textContent='RELEASE TO APPLY · '+count.toLocaleString('en-US')+' CREATURES';
});
populationSlider.addEventListener('change',event=>setPopulation(event.target.value));
const worldUp=vec3(0,1,0),camera={p:vec3(0,21,77.5),target:vec3()};
const baseCameraPosition={...camera.p};let zoom=1;
function applyZoom(){camera.p.x=baseCameraPosition.x/zoom;camera.p.y=baseCameraPosition.y/zoom;camera.p.z=baseCameraPosition.z/zoom;}
const activePointers=new Map();let pinchDistance=0;
function pointerDistance(){const points=[...activePointers.values()];return points.length<2?0:Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y);}
canvas.addEventListener("pointerdown",event=>{activePointers.set(event.pointerId,{x:event.clientX,y:event.clientY});canvas.setPointerCapture?.(event.pointerId);if(activePointers.size===2)pinchDistance=pointerDistance();});
canvas.addEventListener("pointermove",event=>{if(!activePointers.has(event.pointerId))return;activePointers.set(event.pointerId,{x:event.clientX,y:event.clientY});if(activePointers.size===2){const next=pointerDistance();if(pinchDistance>0&&next>0){zoom=Math.max(0.22,Math.min(4.5,zoom*next/pinchDistance));applyZoom();}pinchDistance=next;}});
function releasePointer(event){activePointers.delete(event.pointerId);pinchDistance=activePointers.size===2?pointerDistance():0;}
canvas.addEventListener("pointerup",releasePointer);canvas.addEventListener("pointercancel",releasePointer);canvas.addEventListener("lostpointercapture",releasePointer);
for(const name of ["gesturestart","gesturechange","gestureend"])document.addEventListener(name,event=>event.preventDefault(),{passive:false});
window.addEventListener("wheel",event=>{if(event.ctrlKey)event.preventDefault();},{passive:false});
const sub=(a,b)=>add3(a,scale3(b,-1));
const cameraForward=normalize3(sub(camera.target,camera.p));
const cameraRight=normalize3(cross3(cameraForward,worldUp));
const cameraUp=normalize3(cross3(cameraRight,cameraForward));
let viewWidth=1,viewHeight=1;
initialiseFishVisualState(school);
function project(point){
 const relative=sub(point,camera.p),depth=dot3(relative,cameraForward),focal=Math.min(viewWidth,viewHeight)*1.08,size=focal/Math.max(4,depth);
 return{x:viewWidth*.5+dot3(relative,cameraRight)*size,y:viewHeight*.52-dot3(relative,cameraUp)*size,depth,size};
}
function makeMesh(){
 const vertices=[],faces=[],rings=12,sides=10;
 for(let i=0;i<=rings;i++){
  const t=i/rings,x=.98-2.65*t,profile=Math.pow(Math.max(0,Math.sin(Math.PI*t)),.68);
  const ry=.43*profile*(1.08-.22*t),rz=.35*profile*(1.06-.2*t);
  for(let j=0;j<sides;j++){const a=j/sides*TAU;vertices.push(vec3(x,Math.cos(a)*ry,Math.sin(a)*rz));}
 }
 for(let i=0;i<rings;i++)for(let j=0;j<sides;j++){
  const a=i*sides+j,b=i*sides+(j+1)%sides,c=(i+1)*sides+(j+1)%sides,d=(i+1)*sides+j;
  const radial=Math.cos(j/sides*TAU)*.82+Math.sin(j/sides*TAU)*.48;
  const shade=Math.max(.08,Math.min(1,.48+radial*.5));
  const fill=palette[shade>.78?4:shade>.57?3:shade>.34?2:shade>.18?1:0];
  faces.push({indices:[a,b,c],fill},{indices:[a,c,d],fill});
 }
 return{vertices,faces};
}
const palette=['#174b5b','#286f79','#469d98','#78c7ad','#c0ead0'];
const mesh=makeMesh();
function worldPoint(fish,q,local){return add3(fish.p,quatRotate(q,scale3(deformPoint(local,fish.gait),SCHOOLING_FISH_SCALE*(fish.bodyScale??1))));}
function polygon(fish,q,points,fill,alpha=1,stroke=null){
 const p=points.map(v=>project(worldPoint(fish,q,v)));
 if(p.some(v=>v.depth<2.5))return;
 ctx.globalAlpha=alpha;ctx.beginPath();p.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));
 ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.7;ctx.stroke();}
}
function eelWorldPoint(fish,q,local){
 const lengthScale=2.65/3.95;
 // Stretch aft of the head pivot, preserving the blunt head and jaw proportions.
 const eelLength=fish.eelLengthScale??3;
 const stretchedX=1.08+(local.x-1.08)*eelLength;
 const compressed={x:stretchedX*lengthScale,y:local.y,z:local.z};
 const deformed=deformPoint(compressed,fish.gait);
 deformed.x/=lengthScale;
 return add3(fish.p,quatRotate(q,scale3(deformed,SCHOOLING_FISH_SCALE*(fish.bodyScale??1))));
}
function drawEel(fish){
 const yaw=Math.atan2(-fish.forward.z,fish.forward.x),pitch=Math.atan2(fish.forward.y,Math.hypot(fish.forward.x,fish.forward.z));
 const q=quatFromEuler(yaw,pitch,0),centre=project(fish.p),alpha=Math.max(.56,Math.min(.98,1.18-centre.depth*.018));
 const upper=[],lower=[];
 for(let i=0;i<=36;i++){
  const u=i/36,x=1.08-u*4.1;
  const headBulge=Math.exp(-Math.pow(u/.19,2));
  const width=.12 + .18*Math.pow(1-u,.58) + .13*headBulge;
  upper.push({x,y:width,z:0});lower.unshift({x,y:-width*.92,z:0});
 }
 const points=[...upper,...lower].map(v=>project(eelWorldPoint(fish,q,vec3(v.x,v.y,v.z))));
 if(points.every(v=>v.depth>2.5)){
  ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
  const skin=ctx.createLinearGradient(centre.x,centre.y-centre.size*.2,centre.x,centre.y+centre.size*.2);
  skin.addColorStop(0,'#91a27a');skin.addColorStop(.42,'#526d53');skin.addColorStop(1,'#263f3b');
  ctx.fillStyle=skin;ctx.fill();ctx.strokeStyle='#182f2d';ctx.lineWidth=Math.max(.8,centre.size*.018);ctx.stroke();
  const ridge=[];
  for(let i=0;i<=24;i++){const u=i/24,x=.82-u*3.62,w=.12+.18*Math.pow(1-u,.58);ridge.push(project(eelWorldPoint(fish,q,vec3(x,w*.88,0))));}
  if(ridge.every(v=>v.depth>2.5)){ctx.beginPath();ridge.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='rgba(176,194,143,.82)';ctx.lineWidth=Math.max(.6,centre.size*.009);ctx.stroke();}
  // Irregular olive mottling gives the skin the broken pattern of a moray.
  for(let spot=0;spot<18;spot++){
   const u=.12+(spot*0.137)%0.78,x=.88-u*3.55,w=.11+.18*Math.pow(1-u,.58);
   const p=project(eelWorldPoint(fish,q,vec3(x,w*(.35+((spot*7)%9)/12),.015)));
   if(p.depth>2.5){ctx.beginPath();ctx.ellipse(p.x,p.y,Math.max(.7,p.size*.026),Math.max(.45,p.size*.014),spot*.71,0,TAU);ctx.fillStyle=spot%3===0?'rgba(24,43,34,.58)':'rgba(179,174,119,.35)';ctx.fill();}
  }
  const eye=project(eelWorldPoint(fish,q,vec3(.88,.17,.105)));
  if(eye.depth>2.5){ctx.beginPath();ctx.arc(eye.x,eye.y,Math.max(1.3,eye.size*.034),0,TAU);ctx.fillStyle='#e4d4ae';ctx.fill();ctx.beginPath();ctx.arc(eye.x+eye.size*.007,eye.y,Math.max(.8,eye.size*.018),0,TAU);ctx.fillStyle='#171c18';ctx.fill();}
  // Broad hinged jaw with a dark mouth cavity and fine conical teeth.
  const upperA=project(eelWorldPoint(fish,q,vec3(1.06,.035,.015)));
  const upperB=project(eelWorldPoint(fish,q,vec3(.72,-.005,.015)));
  const lowerA=project(eelWorldPoint(fish,q,vec3(1.02,-.085,.015)));
  const lowerB=project(eelWorldPoint(fish,q,vec3(.72,-.005,.015)));
  if([upperA,upperB,lowerA,lowerB].every(p=>p.depth>2.5)){
   ctx.beginPath();ctx.moveTo(upperA.x,upperA.y);ctx.lineTo(upperB.x,upperB.y);ctx.lineTo(lowerA.x,lowerA.y);ctx.closePath();ctx.fillStyle='#172321';ctx.fill();
   ctx.beginPath();ctx.moveTo(lowerA.x,lowerA.y);ctx.lineTo(lowerB.x,lowerB.y);ctx.strokeStyle='#b58d73';ctx.lineWidth=Math.max(1,centre.size*.025);ctx.stroke();
   for(let tooth=0;tooth<5;tooth++){const t=(tooth+1)/6,x=upperA.x+(upperB.x-upperA.x)*t,y=upperA.y+(upperB.y-upperA.y)*t;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-centre.size*.012,y+centre.size*.035);ctx.strokeStyle='#eee2c7';ctx.lineWidth=Math.max(.65,centre.size*.009);ctx.stroke();}
  }
  for(let g=0;g<3;g++){const a=project(eelWorldPoint(fish,q,vec3(.43-g*.1,-.12,.02))),b=project(eelWorldPoint(fish,q,vec3(.39-g*.1,-.2,.02)));if(a.depth>2.5&&b.depth>2.5){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='rgba(24,43,34,.7)';ctx.lineWidth=Math.max(.7,centre.size*.012);ctx.stroke();}}
  ctx.restore();
 }
}
function drawCrustacean(fish){
 const lobster=fish.species==='lobster',scale=fish.bodyScale??1;
 const yaw=Math.atan2(-fish.forward.z,fish.forward.x),q=quatFromEuler(yaw,0,0);
 const centre=project(fish.p),alpha=Math.max(.58,Math.min(.98,1.18-centre.depth*.018));
 const bodyLength=lobster?.8:.72,bodyWidth=lobster?.4:.56,hidden=!lobster&&fish.sheltering;
 const point=(x,y,z)=>project(add3(fish.p,quatRotate(q,vec3(x*scale,y*scale,z*scale))));
 ctx.save();ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.lineJoin='round';
 if(!lobster){
  // Four paired walking legs. Each limb has a visible coxa, backward-kneed
  // merus and tapered distal segment, all rooted beneath the carapace edge.
  for(const side of [-1,1])for(let leg=0;leg<4;leg++){
   const x=(leg-1.5)*bodyLength*.34;
   const phase=fish.groundPhase+leg*Math.PI+(side>0?Math.PI:0);
   const stride=Math.sin(phase),lift=Math.max(0,Math.cos(phase))*.085;
   const hip=point(x,-.035,side*.285);
   const coxa=point(x+stride*.035,-.075,side*.43);
   const knee=point(x+(leg<2?.13:-.16)+stride*.075,-.19+lift*.18,side*.67);
   const ankle=point(x+(leg<2?.21:-.24)+stride*.13,-.265+lift,side*.86);
   const tip=point(x+(leg<2?.27:-.3)+stride*.17,-.285+lift,side*1.02);
   const width=Math.max(1.25,centre.size*.038*scale);
   ctx.strokeStyle='#527e78';ctx.lineWidth=width*1.18;
   ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(coxa.x,coxa.y);ctx.lineTo(knee.x,knee.y);ctx.lineTo(ankle.x,ankle.y);ctx.lineTo(tip.x,tip.y);ctx.stroke();
   for(const joint of [coxa,knee,ankle]){
    ctx.beginPath();ctx.arc(joint.x,joint.y,Math.max(.8,width*.58),0,TAU);ctx.fillStyle='#79a99a';ctx.fill();
   }
   ctx.strokeStyle='rgba(45,35,27,.8)';ctx.lineWidth=Math.max(.65,width*.34);
   ctx.beginPath();ctx.moveTo(knee.x,knee.y);ctx.lineTo(ankle.x,ankle.y);ctx.lineTo(tip.x,tip.y);ctx.stroke();
  }
 }else{
  for(let side of [-1,1])for(let leg=0;leg<4;leg++){
   const x=(leg-1.5)*bodyLength*.39,z=side*bodyWidth*.56,phase=fish.groundPhase+leg*Math.PI*.5+(side>0?Math.PI:0);
   const stride=Math.sin(phase),lift=Math.max(0,Math.cos(phase))*.075;
   const hip=point(x,-.035,z),coxa=point(x+stride*.035,-.13,side*(bodyWidth*.78));
   const knee=point(x+(leg<2?.18:-.18)+stride*.075,-.235+lift*.2,side*(bodyWidth+.22));
   const foot=point(x+(leg<2?.32:-.32)+stride*.14,-.39+lift,side*(bodyWidth+.56));
   ctx.strokeStyle='#477d79';ctx.lineWidth=Math.max(1.5,centre.size*.055*scale);
   ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(coxa.x,coxa.y);ctx.lineTo(knee.x,knee.y);ctx.lineTo(foot.x,foot.y);ctx.stroke();
  }
 }
 const shellLocal=lobster
  ? [[.5,0,0],[.34,.13,.34],[-.22,.16,.39],[-.49,.035,.23],[-.52,-.015,0],[-.49,.035,-.23],[-.22,.16,-.39],[.34,.13,-.34]]
  : [[.58,0,0],[.43,.18,.48],[.08,.24,.58],[-.38,.19,.52],[-.62,.04,.29],[-.66,-.015,0],[-.62,.04,-.29],[-.38,.19,-.52],[.08,.24,-.58],[.43,.18,-.48]];
 const shell=shellLocal.map(([x,y,z])=>point(x*bodyLength,y*(lobster?2.1:2.45),z*bodyWidth));
 ctx.beginPath();shell.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
 ctx.fillStyle=lobster?'#286f70':'#527f70';ctx.strokeStyle=lobster?'#173f50':'#294f48';ctx.lineWidth=Math.max(1,centre.size*.027*scale);ctx.fill();ctx.stroke();
 const ridgeA=point(-bodyLength*.42,.2,0),ridgeB=point(bodyLength*.38,.2,0);
 ctx.beginPath();ctx.moveTo(ridgeA.x,ridgeA.y);ctx.lineTo(ridgeB.x,ridgeB.y);ctx.strokeStyle=lobster?'#79b8a6':'#9ac4a0';ctx.lineWidth=Math.max(.8,centre.size*.022*scale);ctx.stroke();
 if(!lobster){
  // A low domed carapace dominates the silhouette; legs remain short and tucked.
  for(let seam=0;seam<3;seam++){const a=point(-bodyLength*.25+seam*.2,.25,.0),b=point(-bodyLength*.25+seam*.2,.25,.28);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='rgba(52,43,31,.55)';ctx.lineWidth=Math.max(.6,centre.size*.01);ctx.stroke();}
  for(const side of [-1,1]){const eye=point(bodyLength*.43,.18,side*.24);ctx.beginPath();ctx.arc(eye.x,eye.y,Math.max(.7,centre.size*.016*scale),0,TAU);ctx.fillStyle='#27251f';ctx.fill();}
 }else{
  for(const side of [-1,1]){const eye=point(bodyLength*.34,.22,side*.2);ctx.beginPath();ctx.arc(eye.x,eye.y,Math.max(1,centre.size*.025*scale),0,TAU);ctx.fillStyle='#f0dfbb';ctx.fill();}
  for(const side of [-1,1]){const root=point(bodyLength*.38,-.02,side*.28),claw=point(bodyLength*.78,-.1,side*.5);ctx.beginPath();ctx.moveTo(root.x,root.y);ctx.lineTo(claw.x,claw.y);ctx.lineTo(claw.x+centre.size*.025,claw.y-centre.size*.04);ctx.moveTo(claw.x,claw.y);ctx.lineTo(claw.x+centre.size*.025,claw.y+centre.size*.04);ctx.strokeStyle='#75a99a';ctx.lineWidth=Math.max(1,centre.size*.045*scale);ctx.stroke();}
 }
 ctx.restore();
}
function drawMantisShrimp(fish){
 const scale=fish.bodyScale??.8,yaw=Math.atan2(-fish.forward.z,fish.forward.x),q=quatFromEuler(yaw,0,0);
 const centre=project(fish.p),alpha=Math.max(.62,Math.min(.99,1.2-centre.depth*.018));
 const point=(x,y,z)=>project(add3(fish.p,quatRotate(q,vec3(x*scale,y*scale,z*scale))));
 ctx.save();ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.lineJoin='round';
 // Six walking legs keep the small hunter close to the substrate.
 for(const side of [-1,1])for(let leg=0;leg<3;leg++){
  const x=-.28+leg*.25,phase=fish.groundPhase+leg*2.1+(side>0?Math.PI:0);
  const stride=Math.sin(phase)*.055,lift=Math.max(0,Math.cos(phase))*.055;
  const hip=point(x,-.06,side*.2),knee=point(x-.08+stride,-.19+lift,side*.34),foot=point(x-.16+stride*1.4,-.28+lift,side*.48);
  ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(knee.x,knee.y);ctx.lineTo(foot.x,foot.y);
  ctx.strokeStyle='#5f9a83';ctx.lineWidth=Math.max(1.1,centre.size*.055);ctx.stroke();
  for(const joint of [knee]){ctx.beginPath();ctx.arc(joint.x,joint.y,Math.max(.8,centre.size*.018),0,TAU);ctx.fillStyle='#b5cf86';ctx.fill();}
 }
 // Segmented emerald body with a bright, armoured dorsal plate.
 const shell=[[-.62,0,0],[-.43,.2,.28],[.08,.23,.31],[.48,.12,.2],[.58,.02,0],[.48,.12,-.2],[.08,.23,-.31],[-.43,.2,-.28]].map(v=>point(...v));
 ctx.beginPath();shell.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
 ctx.fillStyle='#397d67';ctx.strokeStyle='#173f43';ctx.lineWidth=Math.max(1,centre.size*.035);ctx.fill();ctx.stroke();
 for(let segment=0;segment<4;segment++){
  const x=-.34+segment*.19,a=point(x,.18,.22),b=point(x-.04,.16,-.22);
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='rgba(177,211,139,.68)';ctx.lineWidth=Math.max(.7,centre.size*.018);ctx.stroke();
 }

 function drawShark(fish,whale){
  const scale=fish.bodyScale??(whale?2.7:1.8),yaw=Math.atan2(-fish.forward.z,fish.forward.x),pitch=Math.atan2(fish.forward.y,Math.hypot(fish.forward.x,fish.forward.z)),q=quatFromEuler(yaw,pitch,0);

  ctx.save();ctx.globalAlpha=alpha;ctx.lineJoin='round';

  if(whale){
    poly([[1.12,.02,0],[.98,.27,.28],[.55,.34,.38],[-.35,.29,.32],[-1.02,.16,.2],[-1.24,.02,0],[-1.02,.16,-.2],[-.35,.29,-.32],[.55,.34,-.38],[.98,.27,-.28]],dorsal,outline);
    poly([[.98,-.02,0],[.7,-.22,.28],[-.55,-.2,.25],[-1.12,-.08,0],[-.55,-.2,-.25],[.7,-.22,-.28]],belly);
    // Broad terminal mouth and paired filter-feeding gill slits.
    const mouthL=point(1.12,-.015,-.23),mouthR=point(1.12,-.015,.23);

      const pulse=1+0.12*Math.sin((fish.filterFeedPhase??0)+k*.42);
      const a=point(.45-k*.13,.02,.315),b=point(.42-k*.13,-.12*pulse,.32);
      if(a.depth>2.5&&b.depth>2.5){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='rgba(22,45,57,.82)';ctx.lineWidth=Math.max(.8,centre.size*.014);ctx.stroke();}
    }

    for(let row=0;row<3;row++)for(let col=0;col<9;col++){

    }

    poly([[-.48,.2,0],[-.82,.5,0],[-.78,.13,0]],'#3d5e70',outline);
    poly([[-1.12,.02,0],[-1.68,.34,0],[-1.54,.015,0],[-1.68,-.25,0],[-1.12,-.04,0]],'#3d5e70',outline);
    for(const side of [-1,1])poly([[.42,.02,side*.22],[-.02,-.02,side*.55],[-.92,-.1,side*.82],[-.48,-.16,side*.25]],dorsal,outline);
  }else{
    poly([[1.16,.015,0],[.92,.23,.2],[.38,.27,.23],[-.48,.18,.18],[-1.08,.08,.1],[-1.22,.015,0],[-1.08,.08,-.1],[-.48,.18,-.18],[.38,.27,-.23],[.92,.23,-.2]],dorsal,outline);
    poly([[.78,-.02,0],[.38,-.18,.18],[-.68,-.13,.13],[-1.12,-.035,0],[-.68,-.13,-.13],[.38,-.18,-.18]],belly);
    // Tall first dorsal, smaller second dorsal, paired pectorals and heterocercal tail.
    poly([[.25,.22,0],[.03,.78,0],[-.34,.2,0]],'#405d68',outline);
    poly([[-.67,.13,0],[-.86,.37,0],[-1.02,.08,0]],'#405d68',outline);
    for(const side of [-1,1])poly([[.42,.02,side*.15],[.05,-.04,side*.28],[-.72,-.28,side*.62],[-.4,-.12,side*.18]],'#425f6a',outline);
    poly([[-1.04,.06,0],[-1.55,.55,0],[-1.43,.03,0],[-1.62,-.34,0],[-1.26,-.09,0]],'#425f6a',outline);
    // Five visible gill slits and a small eye.
    for(let k=0;k<5;k++){const a=point(.35-k*.105,.13,.205),b=point(.31-k*.105,-.04,.21);if(a.depth>2.5&&b.depth>2.5){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='rgba(20,42,50,.82)';ctx.lineWidth=Math.max(.8,centre.size*.014);ctx.stroke();}}
    const eye=point(.79,.12,.19);if(eye.depth>2.5){ctx.beginPath();ctx.arc(eye.x,eye.y,Math.max(1,centre.size*.022),0,TAU);ctx.fillStyle='#e1d8b6';ctx.fill();ctx.beginPath();ctx.arc(eye.x,eye.y,Math.max(.65,centre.size*.012),0,TAU);ctx.fillStyle='#152832';ctx.fill();}
  }
  ctx.restore();
 }
 function drawStingray(fish){
 const scale=fish.bodyScale??1.1,yaw=Math.atan2(-fish.forward.z,fish.forward.x),q=quatFromEuler(yaw,0,0);
 const centre=project(fish.p),alpha=Math.max(.62,Math.min(.98,1.2-centre.depth*.018));
 const flap=Math.sin(fish.wingPhase??0),lift=flap*.2;
 const point=(x,y,z)=>project(add3(fish.p,quatRotate(q,vec3(x*scale,y*scale,z*scale))));
 const poly=(vertices,fill,stroke)=>{const p=vertices.map(v=>point(...v));if(p.some(v=>v.depth<2.5))return;ctx.beginPath();p.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(.8,centre.size*.018);ctx.stroke();}};

 // A low diamond-shaped disc with broad pectoral fins that undulate close to the sand.

  if(edge.every(p=>p.depth>2.5)){ctx.beginPath();edge.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='rgba(190,211,197,.55)';ctx.lineWidth=Math.max(.7,centre.size*.018);ctx.stroke();}
 }
 poly([[.68,.045,0],[.48,.13,.35],[-.12,.12,.48],[-.88,.025,.18],[-1.04,-.015,0],[-.88,.025,-.18],[-.12,.12,-.48],[.48,.13,-.35]],'#526e73','#2c4850');
 poly([[.38,-.035,0],[.12,-.09,.34],[-.65,-.07,.2],[-.78,-.045,0],[-.65,-.07,-.2],[.12,-.09,-.34]],'#a8b8a9');
 for(const side of [-1,1]){
  const eye=point(.48,.13,side*.29);if(eye.depth>2.5){ctx.beginPath();ctx.arc(eye.x,eye.y,Math.max(1.1,centre.size*.026),0,TAU);ctx.fillStyle='#d8d7bb';ctx.fill();ctx.beginPath();ctx.arc(eye.x,eye.y,Math.max(.65,centre.size*.013),0,TAU);ctx.fillStyle='#172d32';ctx.fill();}
  const gill=point(.02,-.09,side*.25),gillEnd=point(-.38,-.09,side*.28);if(gill.depth>2.5&&gillEnd.depth>2.5){ctx.beginPath();ctx.moveTo(gill.x,gill.y);ctx.lineTo(gillEnd.x,gillEnd.y);ctx.strokeStyle='rgba(34,58,62,.8)';ctx.lineWidth=Math.max(.7,centre.size*.012);ctx.stroke();}
 }
 const tailA=point(-.92,.015,0),tailB=point(-2.15,-.025,0);
 if(tailA.depth>2.5&&tailB.depth>2.5){ctx.beginPath();ctx.moveTo(tailA.x,tailA.y);ctx.quadraticCurveTo((tailA.x+tailB.x)*.5,tailA.y-centre.size*.018,tailB.x,tailB.y);ctx.strokeStyle='#71898a';ctx.lineWidth=Math.max(.7,centre.size*.016);ctx.stroke();}

}
function render(){
 const rect=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
 const width=Math.max(1,Math.round(rect.width*dpr)),height=Math.max(1,Math.round(rect.height*dpr));
 if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}
 ctx.setTransform(dpr,0,0,dpr,0,0);viewWidth=rect.width;viewHeight=rect.height;
 const gradient=ctx.createRadialGradient(viewWidth*.5,viewHeight*.46,5,viewWidth*.5,viewHeight*.5,Math.max(viewWidth,viewHeight)*.78);
 gradient.addColorStop(0,'#17414a');gradient.addColorStop(.5,'#0b2832');gradient.addColorStop(1,'#04121a');ctx.fillStyle=gradient;ctx.fillRect(0,0,viewWidth,viewHeight);
 drawSeabed();

 drawPlankton();
 const ordered=school.fish.slice().sort((a,b)=>project(b.p).depth-project(a.p).depth);
 for(const fish of ordered)drawFish(fish);
 drawShelterForeground();
}
let previous=performance.now(),accumulator=0,renderAccumulator=0,frame=0;
function animate(now){
 const elapsed=Math.min(.05,(now-previous)/1000);previous=now;accumulator+=elapsed;
 const dt=1/60;
 while(accumulator>=dt){
  stepSchool(school,dt);
  for(const fish of school.fish){
   const nextYaw=Math.atan2(-fish.forward.z,fish.forward.x),nextPitch=Math.atan2(fish.forward.y,Math.hypot(fish.forward.x,fish.forward.z));
   const turn=Math.max(-1,Math.min(1,angleDelta(fish.heading,nextYaw)*1.7));
   if(fish.species==='fish'||fish.species==='eel')stepGait(fish.gait,fish.species==='eel'?'MORAY':'CRUISE',Math.hypot(fish.v.x,fish.v.y,fish.v.z),turn,dt);
   fish.heading=nextYaw;fish.pitch=nextPitch;
  }
  accumulator-=dt;
 }
 renderAccumulator+=elapsed;
 if(renderAccumulator>=1/30){render();renderAccumulator%=1/30;}
 if(frame++%30===0){const counts={fish:0,schoolFish:0,eel:0,crab:0,lobster:0,mantis:0,manta:0,stingray:0,shark:0,whaleShark:0,starfish:0,dolphin:0};for(const agent of school.fish)counts[agent.species]++;status.textContent=school.fish.length.toLocaleString('en-US')+' CREATURES · 12 SPECIES · '+(school.metrics.eaten??0)+' EATEN';speciesCounts.innerHTML='<b>REGULAR FISH</b> '+counts.fish+'<br><b>EELS</b> '+counts.eel+'<br><b>CRABS</b> '+counts.crab+'<br><b>LOBSTERS</b> '+counts.lobster+'<br><b>MANTIS SHRIMP</b> '+counts.mantis+'<br><b>MANTA RAYS</b> '+counts.manta+'<br><b>STINGRAYS</b> '+counts.stingray+'<br><b>SHARKS</b> '+counts.shark+'<br><b>WHALE SHARKS</b> '+counts.whaleShark+'<br><b>STARFISH</b> '+counts.starfish+'<br><b>DOLPHINS</b> '+counts.dolphin+'<br><b>SCHOOLING FISH</b> '+counts.schoolFish;metrics.textContent='MEAN SPEED '+school.metrics.averageSpeed.toFixed(2)+' · CONTACTS '+school.metrics.collisions+' · PREY CAPTURE '+(school.metrics.eaten??0);}
 requestAnimationFrame(animate);
}
