<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06141b">
<title>Mocean · Phase 6 renderer spike</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06141b;color:#d9eee5;font:12px ui-monospace,monospace}
canvas{display:block;width:100%;height:100%}#status{position:fixed;left:18px;top:16px;padding:9px 12px;background:#06141bd9;border:1px solid #8acbb54a;line-height:1.6;pointer-events:none}#status b{color:#9be7c8}
</style>
</head>
<body>
<div id="status"><b>MOCEAN / PHASE 6 RENDERER SPIKE</b><br>Initialising WebGL2 scene…</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { createPhase6Renderer, detectWebGL2 } from './src/phase6/renderer.js';
import { seabedHeight } from './src/schooling.js';
import { createTerrainFloor, generateTerrainFeatures } from './src/phase6/terrain.js';

const status=document.getElementById('status');
if(!detectWebGL2()){
 status.innerHTML='<b>WEBGL2 UNAVAILABLE</b><br>Existing Canvas habitat remains the fallback. No simulation has been started.';
 throw new Error('WebGL2 unavailable');
}
const canvas=document.createElement('canvas');
canvas.setAttribute('aria-label','Experimental three-dimensional underwater terrain renderer');
document.body.append(canvas);
try{
 const view=createPhase6Renderer({THREE,canvas,pixelRatio:Math.min(devicePixelRatio||1,1.5)});
 const {scene,camera}=view;
 scene.background=new THREE.Color('#08232c');
 scene.fog=new THREE.FogExp2('#0b3540',.012);
 const ambient=new THREE.HemisphereLight('#b7e8e4','#172b29',2.0);scene.add(ambient);
 const sun=new THREE.DirectionalLight('#b9e8ff',2.2);sun.position.set(-24,34,18);scene.add(sun);
 const fill=new THREE.DirectionalLight('#4b9da9',.75);fill.position.set(22,7,-24);scene.add(fill);

 const features=generateTerrainFeatures({
  seed:6102026,
  bounds:{minX:-40,maxX:40,minZ:-28,maxZ:28},
  rockCount:34,archCount:6,shelfCount:8,crevasseCount:5,
  floorAt:seabedHeight
 });
 const terrainFloor=createTerrainFloor(seabedHeight,features);
 const nx=120,nz=84,width=84,depth=60,positions=[],indices=[],colours=[];
 for(let iz=0;iz<=nz;iz++)for(let ix=0;ix<=nx;ix++){
  const x=-width/2+ix/nx*width,z=-depth/2+iz/nz*depth,y=terrainFloor(x,z);
  positions.push(x,y,z);
  const sand=.5+.5*Math.sin(x*.19+z*.13)*Math.cos(z*.17-x*.08);
  colours.push(.13+sand*.10,.22+sand*.09,.19+sand*.06);
  if(ix<nx&&iz<nz){const a=iz*(nx+1)+ix,b=a+1,c=a+(nx+1),d=c+1;indices.push(a,c,b,b,c,d);}
 }
 const terrainGeometry=new THREE.BufferGeometry();
 terrainGeometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
 terrainGeometry.setAttribute('color',new THREE.Float32BufferAttribute(colours,3));
 terrainGeometry.setIndex(indices);terrainGeometry.computeVertexNormals();
 const terrain=new THREE.Mesh(terrainGeometry,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.96,metalness:0,side:THREE.DoubleSide}));
 scene.add(terrain);

 const rockGeometry=new THREE.SphereGeometry(1,14,10);
 const rockMaterials=['#465b50','#526458','#3c514d','#5a6254'].map(color=>new THREE.MeshStandardMaterial({color,roughness:1,flatShading:true}));
 features.rocks.forEach((rock,i)=>{
  const mesh=new THREE.Mesh(rockGeometry,rockMaterials[i%rockMaterials.length]);
  mesh.position.set(rock.x,rock.y,rock.z);
  mesh.scale.set(rock.radius,rock.height,rock.depth);
  mesh.rotation.set(rock.tilt,rock.rotation,rock.tilt*.6);scene.add(mesh);
 });
 const shelfGeometry=new THREE.BoxGeometry(1,1,1);
 const shelfMaterials=['#53675f','#617269','#465c55'].map(color=>new THREE.MeshStandardMaterial({color,roughness:.98,flatShading:true}));
 features.shelves.forEach((shelf,i)=>{
  const mesh=new THREE.Mesh(shelfGeometry,shelfMaterials[i%shelfMaterials.length]);
  mesh.position.set(shelf.x,shelf.y,shelf.z);
  mesh.scale.set(shelf.width,shelf.height,shelf.depth);
  mesh.rotation.y=shelf.rotation;scene.add(mesh);
 });
 const archMaterial=new THREE.MeshStandardMaterial({color:'#52645a',roughness:1,flatShading:true,side:THREE.DoubleSide});
 features.arches.forEach(arch=>{
  const geometry=new THREE.TorusGeometry(arch.radius,arch.tube,10,48,Math.PI);
  geometry.scale(1,1,arch.depth/(2*arch.tube));
  const mesh=new THREE.Mesh(geometry,archMaterial);
  mesh.position.set(arch.x,arch.floor+arch.tube,arch.z);
  mesh.rotation.y=arch.rotation;scene.add(mesh);
 });
 const sandBed=new THREE.Mesh(new THREE.PlaneGeometry(180,140),new THREE.MeshStandardMaterial({color:'#183b3b',roughness:1,side:THREE.DoubleSide}));
 sandBed.rotation.x=-Math.PI/2;sandBed.position.y=-15;sandBed.position.z=-5;scene.add(sandBed);

 const resize=()=>view.resize(innerWidth,innerHeight);
 addEventListener('resize',resize,{passive:true});resize();
 let raf=0;const animate=()=>{view.render();raf=requestAnimationFrame(animate);};animate();
 status.innerHTML='<b>WEBGL2 / THREE.JS r180</b><br>Raised shelves · eroded sand channels · rock and arch formations<br>Simulation untouched · renderer spike only';
 window.addEventListener('pagehide',()=>{cancelAnimationFrame(raf);view.dispose();terrainGeometry.dispose();rockGeometry.dispose();rockMaterials.forEach(material=>material.dispose());shelfGeometry.dispose();shelfMaterials.forEach(material=>material.dispose());archMaterial.dispose();sandBed.geometry.dispose();sandBed.material.dispose();});
}catch(error){
 status.innerHTML='<b>RENDERER INITIALISATION FAILED</b><br>'+String(error?.message??error);
 throw error;
}
</script>
</body>
</html>
